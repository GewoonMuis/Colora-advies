<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Colora Technisch Advies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<style>
:root{--rf:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ece8e1;--panel:#fff;--ink:#2a2022;--mute:#76686b;--line:#ddd5ca;--brand:#5f1f29;--accent:#c4473a;--soft:#f3efe8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1517;--panel:#231d1f;--ink:#efe8e9;--mute:#a8999c;--line:#3a3033;--brand:#d99aa5;--accent:#ff8f80;--soft:#2b2326}}
:root[data-theme="dark"]{--bg:#1a1517;--panel:#231d1f;--ink:#efe8e9;--mute:#a8999c;--line:#3a3033;--brand:#d99aa5;--accent:#ff8f80;--soft:#2b2326}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:minmax(330px,440px) 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto;align-items:start}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
h1{font:600 19px system-ui,sans-serif;margin:0 0 2px;color:var(--brand)}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
h2{font:600 15px system-ui,sans-serif;margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{resize:vertical;min-height:62px}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:7px 12px}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
button.danger{color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{border-color:var(--accent)}
.thumb .x{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;cursor:pointer}
.card{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:12px;margin:10px 0}
.card .head{display:flex;gap:8px;align-items:center}
.hint{font-size:12px;color:var(--mute)}
details summary{cursor:pointer;font-size:13px;color:var(--brand);margin-top:10px}
#status{font-size:12px;color:var(--mute)}

/* A4 pages in Colora house style */
.preview{display:flex;flex-direction:column;gap:18px;align-items:center;min-width:0}
.sheet{position:relative;width:210mm;height:297mm;flex:none;background:#f6f3ec;color:#2a2022;font:10.5pt/1.45 var(--rf);overflow:hidden;box-shadow:0 1px 4px #0004}
.sheet.cover{background-image:none}
.sheet.cover img{display:block;width:100%}
.cv{position:absolute;left:10mm;top:14mm;width:192mm;height:256mm;background:#dfe9e9 center/cover no-repeat;border-radius:5mm 32mm 5mm 32mm}
.sheet.pg{}
.foot{position:absolute;left:12mm;bottom:8mm;font:10pt/1.3 Calibri,Carlito,Arial,sans-serif;color:#333}
.foot u{color:#5f1f29}
h2.t{all:unset;display:block;position:absolute;top:36mm;left:12mm;right:12mm;font:700 17pt var(--rf);color:#5f1f29;border-bottom:.4mm solid #5f1f29;padding-bottom:2mm}
.intro{position:absolute;top:46mm;left:20mm;right:20mm}
.intro p{margin:0 0 4mm;max-width:150mm}
.intro h3{margin:10mm 0 0;font:700 15pt var(--rf);letter-spacing:.06em;color:#5f1f29;border-bottom:.4mm solid #5f1f29;padding-bottom:2mm}
.intro dl{display:grid;grid-template-columns:44mm 1fr;gap:3mm 4mm;margin:6mm 0 0;font:10.5pt var(--rf)}
.intro dt{color:#5f1f29;font-weight:600}.intro dd{margin:0;color:#2a2022;white-space:pre-line}
.stack{position:absolute;top:48mm;bottom:26mm;left:12mm;right:12mm;overflow:hidden}
.fc{background:#fbf9f5;border:.3mm solid #e0d3d0;border-left:1.6mm solid #5f1f29;border-radius:2.5mm;padding:4mm 5mm;margin-bottom:5mm;color:#2a2022}
.fc h3{margin:0 0 3mm;font:700 12.5pt var(--rf);color:#5f1f29}
.fc p{margin:0 0 2.6mm;white-space:pre-wrap}
.fc p.lb{font-weight:700;color:#5f1f29;margin:3mm 0 1mm}
.fc ul{margin:0 0 3mm;padding-left:6mm}
.rm{margin-top:3mm;padding:2.5mm 3.5mm;background:#fdf1ee;border-left:1.2mm solid #d9776a;border-radius:1.5mm;white-space:pre-wrap}
.rm b{display:block;color:#a8473b;margin-bottom:1mm}.fc li::marker{color:#5f1f29}
.ph{display:grid;gap:3mm;margin-bottom:3.5mm}
.ph.p1{grid-template-columns:1fr}.ph.p2{grid-template-columns:1fr 1fr}
.ph .im{width:100%;height:64mm;background:#ece6dc center/contain no-repeat;border-radius:2mm}
.ph.p1 .im{height:80mm}
.closing{position:absolute;top:92mm;left:40mm;right:40mm;text-align:center}
.closing p{margin:0 0 5mm}
.sheet.cv2{background:#f3f0e8}
.cv2 .tr{position:absolute;right:0;top:0;width:27.5mm;height:49.6mm;background:#5f1f29;border-bottom-left-radius:15mm}
.cv2 .lg{position:absolute;left:19.1mm;top:12.7mm;width:77.0mm}
.cv2 .ti{position:absolute;left:17.9mm;top:50mm;font:800 46pt/1 var(--rf);color:#5f1f29;white-space:nowrap}
.cv2 .ph2{position:absolute;left:0;right:0;top:73.7mm;height:175.3mm;background:#cfd8d4 center/cover no-repeat}
.cv2 .bl{position:absolute;left:0;bottom:0;width:93.5mm;height:75mm;background:#531924;border-top-right-radius:25mm;color:#fff}
.cv2 .bl i{position:absolute;left:16mm;top:13mm;width:17mm;height:.6mm;background:#fff}
.cv2 .bl b{position:absolute;left:16mm;top:18mm;font:500 16pt/1.4 var(--rf);letter-spacing:.14em}
.cv2 .bl span{position:absolute;left:16mm;top:35mm;font:400 12.5pt/1.35 var(--rf)}
.cv2 .ic{position:absolute;left:98mm;right:5mm;top:257mm;height:21mm;display:grid;grid-template-columns:repeat(3,1fr)}
.cv2 .ic div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;color:#5f1f29;font:500 11pt var(--rf)}
.cv2 .ic div+div{border-left:.3mm solid #8a6a70}
.cv2 .ic svg{width:9mm;height:9mm;stroke:#5f1f29;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hc{position:absolute;right:0;top:0;width:18mm;height:30mm;background:#5f1f29;border-bottom-left-radius:9mm}
.hl{position:absolute;left:12mm;top:10mm;width:36mm}
.sheet.pg:before{content:"";position:absolute;left:12mm;right:12mm;bottom:19.5mm;height:.3mm;background:#5f1f29;opacity:.5}
.sm{padding:3px 9px;font-size:12px}.lib{border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px;background:var(--soft)}.lib[hidden]{display:none}.lst{max-height:210px;overflow:auto;margin-top:6px}.li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.li i{color:var(--mute);font-style:normal;font-size:12px}
.over:after{content:"Past niet op 1 pagina: splits in 2 vaststellingen of kort in";position:absolute;top:4mm;right:6mm;background:#d9534f;color:#fff;font:11px Arial;padding:2px 8px;border-radius:3px;z-index:3}
.empty{color:#888;padding:6mm}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:12px}.editor{position:static;max-height:none}}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff;height:auto}
 :root{padding:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .editor{display:none!important}
 .app{display:block;padding:0}
 .preview{display:block}
 .sheet{zoom:1!important;box-shadow:none;margin:0;break-after:page}
 .sheet:last-child{break-after:auto}
 .over:after{display:none}
}
</style>
</head>
<body>
<div class="app">
 <section class="editor" aria-label="Verslag invullen">
  <h1>Technisch advies</h1>
  <p class="sub">Colora - intern hulpmiddel voor medewerkers. <span id="status">Nog niet opgeslagen</span></p>

  <h2 style="border:0;margin-top:0;padding-top:0">Klantgegevens</h2>
  <label for="c_name">Naam</label><input id="c_name" data-c="name">
  <label for="c_addr">Adres</label><input id="c_addr" data-c="address">
  <div class="row"><div><label for="c_tel">Tel. nr.</label><input id="c_tel" data-c="phone"></div><div><label for="c_date">Datum</label><input id="c_date" type="date" data-c="date"></div></div>
  <label for="c_rooms">Ruimtes met technisch advies (1 per lijn)</label><textarea id="c_rooms" data-c="rooms" style="min-height:50px" placeholder="Gevel buiten"></textarea>
  <label for="c_email">E-mail</label><input id="c_email" type="email" data-c="email">
  <label for="c_mail">Opmerkingen (optioneel)</label><input id="c_mail" data-c="remarks">
  <details><summary>Winkelgegevens (voetregel)</summary>
   <label for="s_name">Winkel</label><input id="s_name" data-c="store">
   <label for="s_addr">Adres</label><input id="s_addr" data-c="storeAddr">
   <div class="row"><div><label for="s_tel">Telefoon</label><input id="s_tel" data-c="storeTel"></div><div><label for="s_mail">E-mail</label><input id="s_mail" data-c="storeMail"></div></div>
  </details>


  <h2>Foto's</h2>
  <input id="file" type="file" accept="image/*" multiple>
  <div class="hint">Foto's worden verkleind zodat ze vlot opslaan en printen.</div>
  <div class="thumbs" id="gallery"></div>

  <h2>Vaststellingen</h2>
  <div id="findings"></div>
  <div class="bar"><button class="primary" id="addF">+ Nieuwe vaststelling</button></div>

  <h2>PDF maken</h2>
  <div class="bar"><button class="primary" id="pdf">Opslaan als PDF</button><button class="danger" id="reset">Alles wissen</button></div>
  <div class="hint" id="pdfmsg" role="status">De PDF wordt gedownload en komt in de map Downloads van je toestel.</div>
 </section>
 <main class="preview" id="preview" aria-label="Voorbeeld van het verslag"></main>
</div>

const blank=()=>({c:{name:"",address:"",phone:"",email:"",date:"",rooms:"",remarks:"",store:"Kortrijk",storeAddr:"Engelse wandeling 2 AB , 8500 Kortrijk",storeTel:"056 22 65 19",storeMail:"colora.kortrijk@colora.be"},cover:"",notes:"",photos:[],findings:[]});
const uid=()=>Math.random().toString(36).slice(2,9);
let S=blank();
try{const raw=localStorage.getItem("colora_advies_v2");if(raw){const o=JSON.parse(raw);S=Object.assign(blank(),o);S.c=Object.assign(blank().c,o.c)}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const fmtDate=d=>{if(!d)return"";const[y,m,j]=d.split("-");return j+"/"+m+"/"+y};
let t;function save(){clearTimeout(t);t=setTimeout(()=>{try{localStorage.setItem("colora_advies_v2",JSON.stringify(S));$("#status").textContent="Opgeslagen op dit toestel"}catch(e){$("#status").textContent="Opslaan mislukt (te veel foto's?). Maak nu een PDF."}},400)}

function renderGallery(){$("#gallery").innerHTML=S.photos.map(p=>`<div class="thumb" style="cursor:default"><img src="${p.src}" alt="Foto"><span class="x" data-delp="${p.id}" role="button" aria-label="Foto verwijderen">×</span></div>`).join("")||'<span class="hint">Nog geen foto\'s.</span>'}
function renderFindings(){
 $("#findings").innerHTML=S.findings.map(f=>`<div class="card" data-f="${f.id}">
  <div class="head"><input data-k="title" value="${esc(f.title)}" placeholder="Titel, bv. Regenpijp" aria-label="Titel"><button class="danger" data-delf="${f.id}" aria-label="Vaststelling verwijderen">Wis</button></div>
  <label>Foto's (tik om te kiezen, max. 2)</label>
  <div class="thumbs">${S.photos.map(p=>`<button class="thumb ${f.photoIds.includes(p.id)?"on":""}" data-pick="${p.id}" aria-pressed="${f.photoIds.includes(p.id)}"><img src="${p.src}" alt=""></button>`).join("")||'<span class="hint">Laad eerst foto\'s op.</span>'}</div>
  <div class="hint pmsg" role="status"></div>
  <label>Vaststelling (wat zie je?)</label><textarea data-k="obs">${esc(f.obs)}</textarea>
  <label>Voorbereiding (1 stap per lijn)</label><textarea data-k="treat" style="min-height:96px">${esc(f.treat)}</textarea>${libUI("treat")}
  <label>Verfsysteem (1 product of laag per lijn)</label><textarea data-k="paint" placeholder="Bv. 1 laag **Epofix** (dubbele sterretjes = vetgedrukt)">${esc(f.paint)}</textarea>${libUI("paint")}
  <label>Belangrijke opmerking (optioneel)</label><textarea data-k="remark">${esc(f.remark)}</textarea>
 </div>`).join("");
}

const mk=(cls,html)=>{const d=document.createElement("div");d.className=cls;if(html!=null)d.innerHTML=html;return d};
function hdr(){return `<div class="hc"></div><img class="hl" src="${LOGO}" alt="colora">`}
function foot(){const c=S.c;return `<div class="foot"><b>colora ${esc(c.store)}</b>, ${esc(c.storeAddr)}<br>T <u>${esc(c.storeTel)}</u>, <u>${esc(c.storeMail)}</u></div>`}
function paginate(){
 const root=$("#preview");root.innerHTML="";const c=S.c;
 root.append(mk("sheet cv2",`<div class="tr"></div><img class="lg" src="${LOGO}" alt="colora maak het mooi"><div class="ti">TECHNISCH ADVIES</div><div class="ph2" style="background-image:url(${COVER})"></div><div class="bl"><i></i><b>DUURZAAM<br>EN DESKUNDIG</b><span>Advies op maat van<br>jouw project</span></div><div class="ic"><div><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg><span>Persoonlijk</span></div><div><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span>Deskundig</span></div><div><svg viewBox="0 0 24 24"><path d="M5 19C4 11 9 4 20 4c0 11-6 16-15 15z"/><path d="M5 19c3-5 6-8 10-10"/></svg><span>Op maat</span></div></div>`));
 const rooms=lines(c.rooms).map(r=>"• "+esc(r)).join("\n");
 root.append(mk("sheet pg",hdr()+`<div class="intro"><p><b>Fijn dat we samen aan jouw verfproject kunnen werken.</b></p>
  <p>Elke ondergrond en elke situatie is anders. Daarom denken we graag met je mee om tot een oplossing te komen die niet alleen mooi is, maar ook technisch klopt en lang meegaat. Met het juiste advies en de geschikte producten leggen we samen de basis voor een geslaagd resultaat.</p>
  <p>Onlangs zijn we bij jou ter plaatse geweest om jouw project van dichtbij te bekijken en de situatie goed in te schatten. In dit verslag vind je ons persoonlijk technisch advies op maat, met de aanbevolen producten, de nodige voorbereidingen en een duidelijk stappenplan om de werken correct uit te voeren.</p>
  <p>Bewaar dit document goed. Zo heb je ons advies altijd bij de hand en kan je met vertrouwen aan de slag. Heb je tijdens de uitvoering nog vragen? Dan helpen we je bij Colora graag verder.</p>
  <h3>KLANTGEGEVENS</h3><dl><dt>Naam:</dt><dd>${esc(c.name)}</dd><dt>Adres:</dt><dd>${esc(c.address)}</dd><dt>Tel. Nr.:</dt><dd>${esc(c.phone)}</dd><dt>E-mail:</dt><dd>${esc(c.email)}</dd><dt>Datum:</dt><dd>${fmtDate(c.date)}</dd><dt>Ruimtes met technisch advies:</dt><dd>${rooms}</dd>${c.remarks?`<dt>Opmerkingen:</dt><dd>${esc(c.remarks)}</dd>`:""}</dl></div>${foot()}`));
 let page=null,stack,n=0;
 const newPage=()=>{page=mk("sheet pg",hdr()+`<h2 class="t">Technisch advies</h2><div class="stack"></div>${foot()}`);root.append(page);stack=page.querySelector(".stack");n=0};
 const over=()=>stack.scrollHeight>stack.clientHeight+1;
 const place=f=>{
  n++;
  const ph=S.photos.filter(p=>f.photoIds.includes(p.id)).slice(0,2),tr=lines(f.treat),pa=lines(f.paint);
  if(n>1&&stack.querySelectorAll(".ph .im").length+ph.length>2){n--;return false}
  const card=mk("fc",`<h3>Foto ${n}: ${fmt(f.title)}</h3>${ph.length?`<div class="ph p${Math.min(ph.length,2)}">${ph.map(p=>`<div class="im" role="img" aria-label="Foto" style="background-image:url(${p.src})"></div>`).join("")}</div>`:""}${f.obs?`<p class="lb">Vaststelling</p><p>${fmt(f.obs)}</p>`:""}${tr.length?`<p class="lb">Voorbereiding</p>${tr.map(x=>`<p>${fmt(x)}</p>`).join("")}`:""}${pa.length?`<p class="lb">Verfsysteem</p><ul>${pa.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>`:""}${f.remark?`<div class="rm"><b>Belangrijke opmerking</b>${fmt(f.remark)}</div>`:""}`);
  stack.append(card);
  if(over()){
   if(n>1){card.remove();n--;return false}
   page.classList.add("over");
  }
  return true;
 };
 if(!S.findings.length){newPage();stack.innerHTML='<div class="empty">Voeg een vaststelling toe, dan verschijnt ze hier.</div>'}
 S.findings.forEach(f=>{if(!page)newPage();if(!place(f)){newPage();place(f)}});
 root.append(mk("sheet pg",hdr()+`<div class="closing"><p>Voilà, we hebben je verfproject uitgewerkt van start tot finish. Je hebt alle nodige advies en je boodschappenlijstje. Dus, beste doe-het-zelver, nu het is aan jou. Klaar om je handen uit de mouwen te steken?</p><p>Weet je niet hoe je aan je schilderwerken moet beginnen?<br>Kijk mee hoe het moet op <b>colora.be/nl/doe-het-zelf.</b><br>Je vindt er allerlei instructievideo's met handige tips &amp; tricks om je verfklus tot een goed einde te brengen.</p><p>We zijn alvast benieuwd naar het resultaat.<br>Veel succes!</p></div>${foot()}`));
 fit();
}
function fit(){const z=Math.min(1,$("#preview").clientWidth/794);document.querySelectorAll(".sheet").forEach(s=>s.style.zoom=z)}
addEventListener("resize",fit);

function fillInputs(){document.querySelectorAll("[data-c]").forEach(i=>i.value=S.c[i.dataset.c]||"")}
function all(){renderGallery();renderFindings();paginate()}

document.addEventListener("input",e=>{
 const el=e.target;
 if(el.dataset.libq!==undefined){const p=el.closest(".lib");p.querySelector(".lst").innerHTML=libList(p.dataset.kind,el.value);return}
 if(el.dataset.c)S.c[el.dataset.c]=el.value;
 else if(el.dataset.k){S.findings.find(x=>x.id===el.closest("[data-f]").dataset.f)[el.dataset.k]=el.value}
 else return;
 paginate();save();
});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-delp],[data-delf],[data-pick],[data-libt],[data-add]");if(!b)return;
 const card=b.closest("[data-f]"),f=card&&S.findings.find(x=>x.id===card.dataset.f);
 if(b.dataset.libt){const p=card.querySelector('.lib[data-kind="'+b.dataset.libt+'"]');p.hidden=!p.hidden;if(!p.hidden){p.querySelector(".lst").innerHTML=libList(b.dataset.libt,"");p.querySelector("input").focus()}return}
 if(b.dataset.add){const[k,i]=b.dataset.add.split(":"),ta=card.querySelector('textarea[data-k="'+k+'"]');ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,"")+"\n":"")+LIB[+i][3];f[k]=ta.value;paginate();save();return}
 if(b.dataset.delf){
  if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Zeker? Klik nogmaals";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="Wis"}},3000);return}
  S.findings=S.findings.filter(x=>x.id!==b.dataset.delf);
 }else if(b.dataset.delp){S.photos=S.photos.filter(p=>p.id!==b.dataset.delp);S.findings.forEach(x=>x.photoIds=x.photoIds.filter(i=>i!==b.dataset.delp))}
 else{const i=f.photoIds.indexOf(b.dataset.pick);
  if(i>=0)f.photoIds.splice(i,1);
  else if(f.photoIds.length>=2){card.querySelector(".pmsg").textContent="Maximaal 2 foto's per vaststelling.";return}
  else f.photoIds.push(b.dataset.pick)}
 all();save();
});
$("#addF").onclick=()=>{S.findings.push({id:uid(),title:"",photoIds:[],obs:"",remark:"",treat:"",paint:""});all();save();const l=document.querySelector("#findings .card:last-child input");l&&l.focus()};
async function makePdf(){
 const btn=$("#pdf"),msg=$("#pdfmsg"),idle="Opslaan als PDF";
 const dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
 if(!window.html2canvas||!(window.jspdf&&window.jspdf.jsPDF)){msg.textContent="De PDF-onderdelen konden niet laden. Controleer je internetverbinding en probeer opnieuw.";return}
 btn.disabled=true;
 try{
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const sheets=[...document.querySelectorAll(".sheet")],doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  sheets.forEach(s=>s.style.zoom=1);
  for(let i=0;i<sheets.length;i++){
   btn.textContent="Pagina "+(i+1)+" van "+sheets.length+"...";
   const cv=await html2canvas(sheets[i],{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false});
   if(i)doc.addPage();
   doc.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",0,0,210,297,undefined,"FAST");
  }
  fit();
  const nm=(S.c.name||"verslag").replace(/[^\w\- ]+/g,"").trim()||"verslag",d=S.c.date?S.c.date.split("-"):null;
  await dl.save({filename:"Technisch advies "+nm+(d?" "+d[2]+d[1]+d[0].slice(2):"")+".pdf",data:doc.output("blob")});
  msg.textContent="PDF gedownload.";
 }catch(e){
  fit();
  msg.textContent=e&&e.code==="declined"?"Opslaan geannuleerd.":"PDF maken mislukte"+(e&&(e.code||e.message)?" ("+(e.code||e.message)+")":"")+". Probeer opnieuw.";
 }finally{btn.disabled=false;btn.textContent=idle}
}
$("#pdf").onclick=makePdf;
$("#reset").onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Zeker? Klik nogmaals";setTimeout(()=>{delete b.dataset.sure;b.textContent="Alles wissen"},3000);return}delete b.dataset.sure;b.textContent="Alles wissen";S=blank();fillInputs();all();save()};
$("#file").onchange=async e=>{
 for(const file of e.target.files){
  try{
   const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
   const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
   const k=Math.min(1,1100/Math.max(img.width,img.height)),cv=document.createElement("canvas");
   cv.width=img.width*k;cv.height=img.height*k;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
   S.photos.push({id:uid(),src:cv.toDataURL("image/jpeg",.72)});
  }catch(err){$("#status").textContent="Foto niet leesbaar: "+file.name+" (probeer JPG of PNG)"}
 }
 e.target.value="";all();save();
};
fillInputs();all();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paginate);
</script>
</body>
